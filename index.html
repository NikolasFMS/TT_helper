<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Помощник для настольной игры «Тип-Топ».">
    <meta name="theme-color" content="#075251">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Тип-Топ">
    <meta property="og:title" content="Top Ten — Тип-Топ">
    <meta property="og:description" content="Помощник для настольной игры «Тип-Топ».">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Ruda:wght@700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="ico/icon_x192.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="ico/favicon.ico" type="image/x-icon">
    <title>Top Ten — Тип-Топ</title>
</head>

<body>
    <div class="app">
        <!-- Верхняя панель -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button type="button" id="btn-back" class="icon-btn" onclick="handleBackClick()" aria-label="Назад">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
            </div>

            <div class="top-bar-center" id="top-bar-title">ТИП-ТОП</div>

            <div class="top-bar-right">
                <button type="button" id="btn-sound" class="icon-btn" onclick="toggleSound()" aria-label="Звук">
                    <svg id="icon-sound-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <svg id="icon-sound-off" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <line x1="23" y1="9" x2="17" y2="15"/>
                        <line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                </button>
                <button type="button" id="btn-rules" class="icon-btn" onclick="openRulesModal()" aria-label="Правила игры">?</button>
                <button type="button" id="btn-lang" class="icon-btn lang-btn" onclick="toggleLanguage()" aria-label="Сменить язык">EN</button>
            </div>
        </header>

        <!-- Основная область страниц -->
        <main id="content" class="content" aria-live="polite"></main>
    </div>

    <!-- Модальное окно правил игры (сплошной текст по этапам, без вкладок) -->
    <div id="rules-overlay" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="rules-title" onclick="handleBackdropClick(event, 'rules')">
        <div class="modal-card modal-sheet">
            <div class="modal-header">
                <h2 id="rules-title" class="modal-title"></h2>
                <button type="button" class="icon-btn modal-close" onclick="closeRulesModal()" aria-label="Закрыть">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="rules-body" class="modal-body rules-body"></div>
            <div id="rules-footer" class="rules-footer"></div>
        </div>
    </div>

    <!-- Модальное окно настройки имён игроков -->
    <div id="names-overlay" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="names-title" onclick="handleBackdropClick(event, 'names')">
        <div class="modal-card modal-sheet modal-names">
            <div class="modal-header">
                <h2 id="names-title" class="modal-title"></h2>
                <button type="button" class="icon-btn modal-close" onclick="closeNamesModal()" aria-label="Закрыть">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="names-body" class="modal-body"></div>
            <div id="names-footer" class="rules-footer"></div>
        </div>
    </div>

    <!-- Модальное окно просмотра кляксы на весь экран -->
    <div id="image-overlay" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" onclick="handleBackdropClick(event, 'lightbox')">
        <div class="modal-card lightbox-card">
            <div class="modal-header">
                <h2 id="lightbox-title" class="modal-title"></h2>
                <button type="button" class="icon-btn modal-close" onclick="closeInkblotLightbox()" aria-label="Закрыть">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="lightbox-body">
                <img src="img/inkblot.svg" alt="" id="lightbox-img" class="lightbox-img">
            </div>
        </div>
    </div>

    <!-- Модальное окно подтверждения (всегда поверх остальных модальных окон) -->
    <div id="overlay" class="modal-backdrop modal-confirm-top" role="dialog" aria-modal="true" aria-labelledby="popup-title" onclick="handleBackdropClick(event, 'confirm')">
        <div class="modal-card modal-compact">
            <h2 id="popup-title" class="modal-title"></h2>
            <p id="popup-desc" class="modal-desc"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-primary" id="popup-btn-primary" onclick="confirmPrimaryAction()"></button>
                <button type="button" class="btn btn-secondary" id="popup-btn-secondary" onclick="confirmSecondaryAction()"></button>
            </div>
        </div>
    </div>

    <!-- Прелоадер -->
    <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <img src="img/logo.svg" alt="Top Ten" class="preloader-logo">
            <span id="preloader-text">Loading...</span>
        </div>
    </div>

    <script src="scripts/cards-data.js"></script>
    <script src="scripts/cards-18-en.js"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
